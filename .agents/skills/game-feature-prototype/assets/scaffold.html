<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组队大厅</title>
  <!-- Optional scaffold for a select-and-confirm flow. Replace the sample data, copy and storage key for the actual brief. -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #141b1e;
      --panel: #202b2f;
      --line: #3a4a50;
      --text: #f5f8f6;
      --muted: #b4c5c7;
      --accent: #d2ec90;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(100% - 2rem, 58rem); margin-inline: auto; padding-block: clamp(2rem, 7vw, 5rem); }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
    h2 { margin: 0; font-size: 1.5rem; }
    p { margin: .5rem 0 0; line-height: 1.6; }
    header { padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; margin-top: 1.5rem; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: .75rem; font-weight: 700; }
    .room { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .9rem .75rem; border-bottom: 1px solid var(--line); }
    .room:has(input:checked) { background: var(--panel); box-shadow: inset 3px 0 var(--accent); }
    input { accent-color: var(--accent); width: 1rem; height: 1rem; margin: 0; }
    .room small { display: block; margin-top: .25rem; }
    .room small, .count, #sample-label, #detail-meta { color: var(--muted); }
    .count { font-variant-numeric: tabular-nums; }
    .detail { padding: 1.25rem; background: var(--panel); border-top: 2px solid var(--accent); }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
    button { min-height: 44px; padding: .5rem 1rem; border: 1px solid var(--line); border-radius: .25rem; background: var(--panel); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
    button[type="submit"] { background: var(--accent); color: #182014; border-color: transparent; }
    button:disabled { background: var(--bg); border-color: var(--line); color: var(--muted); cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    #status { min-height: 1.6em; margin-top: .75rem; color: var(--accent); }
    @media (max-width: 42rem) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>组队大厅</h1>
      <p id="sample-label">模拟房间 · 双排</p>
    </header>
    <form class="layout" id="lobby">
      <fieldset id="rooms"><legend>选择房间</legend></fieldset>
      <section class="detail" aria-labelledby="detail-name">
        <h2 id="detail-name"></h2>
        <p id="detail-meta"></p>
        <p id="detail-note"></p>
        <div class="controls">
          <button type="submit" id="join">加入队伍</button>
          <button type="button" id="leave" hidden>退出队伍</button>
        </div>
        <p id="status" role="status"></p>
      </section>
    </form>
  </main>
  <script>
    const rooms = [
      { id: 'casual', name: '休闲双排', tag: '新手友好 · 语音可选', note: '先热身一局，再决定要不要打排位。', players: 1 },
      { id: 'ranked', name: '冲分双排', tag: '钻石段位 · 需要语音', note: '队伍已满，可以看看其他房间。', players: 2 },
      { id: 'warmup', name: '无麦练枪', tag: '不限段位 · 无需语音', note: '练两局近战，结束后各自离队。', players: 1 },
    ];
    const storageKey = 'prototype.squad-lobby.v1';
    const form = document.querySelector('#lobby');
    const list = document.querySelector('#rooms');
    const detailName = document.querySelector('#detail-name');
    const meta = document.querySelector('#detail-meta');
    const note = document.querySelector('#detail-note');
    const statusMessage = document.querySelector('#status');
    const join = document.querySelector('#join');
    const leave = document.querySelector('#leave');

    let joined = readJoined();
    let selected = joined ?? rooms[0].id;
    const options = new Map();

    function readJoined() {
      try {
        const id = localStorage.getItem(storageKey);
        return rooms.find(room => room.id === id && room.players < 2)?.id ?? null;
      } catch {
        return null;
      }
    }

    function saveJoined() {
      try {
        if (joined) localStorage.setItem(storageKey, joined);
        else localStorage.removeItem(storageKey);
      } catch {
        // The current session can still be used when file storage is unavailable.
      }
    }

    for (const room of rooms) {
      const label = document.createElement('label');
      label.className = 'room';
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'room';
      radio.value = room.id;
      const copy = document.createElement('span');
      const title = document.createElement('strong');
      title.textContent = room.name;
      const tag = document.createElement('small');
      tag.textContent = room.tag;
      copy.append(title, tag);
      const count = document.createElement('span');
      count.className = 'count';
      label.append(radio, copy, count);
      list.append(label);
      options.set(room.id, { radio, count });
    }

    function render(message = '') {
      const active = rooms.find(room => room.id === selected);
      const current = rooms.find(room => room.id === joined);
      for (const room of rooms) {
        const { radio, count } = options.get(room.id);
        radio.checked = room.id === selected;
        count.textContent = `${room.players + Number(room.id === joined)} / 2`;
      }
      detailName.textContent = active.name;
      meta.textContent = active.tag;
      note.textContent = active.id === joined ? '你已入队，队伍已就绪。' : active.note;
      join.disabled = Boolean(current) || active.players === 2;
      let joinLabel = '加入队伍';
      if (active.id === joined) joinLabel = '已加入';
      else if (active.players === 2) joinLabel = '房间已满';
      else if (current) joinLabel = '先退出当前队伍';
      join.textContent = joinLabel;
      leave.hidden = !current;
      leave.textContent = current ? `退出${current.name}` : '退出队伍';
      statusMessage.textContent = message || (current ? `当前队伍：${current.name}` : '');
    }

    list.addEventListener('change', event => {
      selected = event.target.value;
      render();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (join.disabled) return;
      joined = selected;
      saveJoined();
      render();
      leave.focus();
    });

    leave.addEventListener('click', () => {
      selected = joined;
      joined = null;
      saveJoined();
      render('已退出队伍，可以重新选择。');
      join.focus();
    });

    render();
  </script>
</body>
</html>
